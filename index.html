<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#18191b">
  
  <!-- Apple iOS Safari Web App (PWA) Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D&D 3.5 & MoMF">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">

  <title>D&D 3.5 · Ficha & Mestre das Muitas Formas</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>

  <!-- Service Worker para funcionamento 100% offline no iPhone -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registrado com sucesso:', reg.scope))
          .catch(err => console.log('ServiceWorker offline não suportado em local file://:', err));
      });
    }
  </script>
</body>
</html>
